<!DOCTYPE html>
<html lang="pt-br">

<head>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="video.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vídeos</title>
</head>

<body>

    <a href="#hero" class="back-to-top"> <i class="bi bi-arrow-up"></i></a>

    <section class="hero-section" id="hero">
        <div class="video-background">
            <!-- autoplay não precisa clicar pra começar o video - muted inicia mutado - loop fica repetindo sempre -->
            <video autoplay muted loop id="bgVideo" >
                <source src="https://cdn.pixabay.com/video/2021/07/23/82515-580137713_tiny.mp4" type="video/mp4" >
                
                <!-- type="video/mp4 garante que vai funcionar em todo navegador -->
            </video>
        </div>
        <div class="hero-content">
            <h1>0 Futuro começa agora.</h1>
            <p>Transforme sua visão em realidade com nossas soluções inovadoras.</p>

            <a href="#videos" class="cta-button"> Descubra Mais</a> 
        </div>
    </section>

    <section class="videos-section" id="videos">
        <h2>Nossos Destaques</h2>
        <div class="video-gallery">

            <div class="video-frame" data-video-url="https://cdn.pixabay.com/video/2025/03/06/262972_tiny.mp4">
                <img src="img/2.png" alt="">
                <div class="overlay"> Clique para assistir </div>
            </div>

            <div class="video-frame" data-video-url="https://cdn.pixabay.com/video/2025/03/06/262970_tiny.mp4">
                <img src="img/3.png" alt="">
                <div class="overlay"> Clique para assistir </div>
            </div>

            <div class="video-frame" data-video-url="https://cdn.pixabay.com/video/2025/03/06/262971_tiny.mp4">
                <img src="img/4.png" alt="">
                <div class="overlay"> Clique para assistir </div>
            </div>

        </div>
    </section>

    <section class="map-section" id="mapa">
        <h2>Onde Estamos</h2>
       <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3658.2938549103283!2d-46.70389101411587!3d-23.521931105536495!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x94cef86ff238bdd9%3A0x944b346262f31e84!2sSenac%20Lapa%20Scipi%C3%A3o!5e0!3m2!1spt-BR!2sbr!4v1765580927640!5m2!1spt-BR!2sbr" width="800" height="600" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
    </section>

<div class="video-waltz">
<iframe width="560" height="315" src="https://www.youtube.com/embed/7sV-jHIp_oQ?si=zW5c1DJRA6S4gq_s" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></div>


    <!-- Modal para Reprodução de Vídeo -->
    <div id="videoModal" class="modal">
        <div class="modal-content">
            <span class="close-button">&times; </span>
            <!-- O iframe do vídeo será injetado aqui pelo JavaScript -->
            <iframe id="modalVideoFrame" width="100%" height="100%" src="" frameborder="0"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                allowfullscreen></iframe>
        </div>
    </div>
    <script src="script.js"></script> 

</body>

</html>
